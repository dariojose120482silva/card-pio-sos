<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - S.O.S Pizza</title>

    <link rel="stylesheet" href="assets/css/admin.css">

</head>

<body>

    <header>
        <h1>🍕 Painel Administrativo S.O.S Pizza</h1>
        <nav class="tabs" role="tablist">
            <button class="tab-btn active" role="tab" aria-selected="true" onclick="showTab('financeiro')">💰
                Financeiro</button>
            <button class="tab-btn" role="tab" aria-selected="false" onclick="showTab('pedidos')">📦 Pedidos</button>
            <button class="tab-btn" role="tab" aria-selected="false" onclick="showTab('insumos')">🧀 Insumos</button>
        </nav>
    </header>

    <main>
        <section id="financeiro" class="section active" role="tabpanel">
            <h2>Resumo Financeiro</h2>

            <!-- ✅ 1. FILTRO DE SEMANA (NOVO) -->
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap;">
                <button onclick="mudarSemana(-1)"
                    style="background: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">◀
                    Semana Anterior</button>
                <span id="periodo-selecionado"
                    style="color: #fff; font-weight: bold; min-width: 200px; text-align: center;"></span>
                <button onclick="mudarSemana(1)"
                    style="background: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">Próxima
                    Semana ▶</button>
                <button onclick="voltarSemanaAtual()"
                    style="background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">Esta
                    Semana</button>
            </div>

            <!-- ✅ 2. BOTÃO DE NOVO LANÇAMENTO -->
            <button class="btn-add" onclick="openModal('modalFinanceiro')">➕ Novo Lançamento Financeiro</button>

            <!-- ✅ 3. RESUMO FINANCEIRO (Onde o JS injeta os cards de saldo) -->
            <div id="resumo-financeiro">Carregando...</div>

            <!-- ✅ 4. HISTÓRICO DETALHADO ESCONDIDO (JÁ EXISTENTE) -->
            <button onclick="toggleHistoricoFinanceiro()"
                style="background: #6c757d; color: white; margin-top: 20px; width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold;">
                Ver Histórico Detalhado de Lançamentos
            </button>

            <div id="container-historico-fin"
                style="display: none; margin-top: 15px; background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444;">
                <h4 style="color: #ccc; margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px;">Últimos
                    Lançamentos:</h4>
                <div id="lista-lancamentos-fin"></div>
            </div>
        </section>

        <section id="pedidos" class="section" role="tabpanel">
            <h2>Últimos Pedidos</h2>
            <button class="btn-add" onclick="openModal('modalPedido')">➕ Novo Pedido</button>
            <div id="lista-pedidos">Carregando...</div>
        </section>

        <section id="insumos" class="section" role="tabpanel">
            <h2>Estoque de Insumos</h2>
            <button class="btn-add" onclick="openModal('modalInsumo')">➕ Novo Insumo</button>
            <div id="lista-insumos">Carregando...</div>
        </section>
    </main>

    <!-- MODAL PEDIDO -->
    <div id="modalPedido" class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloModalPedido">
        <div class="modal-content">
            <h3 id="tituloModalPedido">📦 Novo Pedido</h3>

            <div class="form-group">
                <label>Nome do Cliente:</label>
                <input type="text" id="clienteNome" placeholder="Ex: João Silva">
            </div>

            <div class="form-group">
                <label>Telefone:</label>
                <input type="text" id="clienteTelefone" placeholder="(87) 98100-4878">
            </div>

            <div class="form-group">
                <label>Bairro:</label>
                <select id="clienteBairro" onchange="calcularTaxaAutomatica()">
                    <option value="Sitio Destino" data-taxa="0" selected> Moro no Sítio Destino - Taxa Grátis</option>
                    <option value="Sitio Pau de colher" data-taxa="3.00"> Sítio Pau de Colher - R$ 3,00</option>
                    <option value="Sitio Espinhos" data-taxa="4.00"> Sítio Espinhos - R$ 4,00</option>
                    <option value="Sítio Barreiros" data-taxa="5.00"> Sítio Barreiros - R$ 5,00</option>
                    <option value="FZ Barra" data-taxa="3.00"> FZ: Barra - R$ 3,00</option>
                    <option value="FZ Racharia" data-taxa="6.00"> FZ: Racharia - R$ 6,00</option>
                    <option value="Fz Mlh do Canto" data-taxa="3.00"> FZ: MLH do Canto - R$ 3,00</option>
                    <option value="Fz Encruzilhada" data-taxa="3.00"> FZ: Encruzilhada - R$ 3,00</option>
                    <option value="Umas" data-taxa="3.00"> Úmãs - R$ 3,00</option>
                    <option value="Sítio Pedrera" data-taxa="5.00"> Sítio Pedrera - R$ 5,00</option>
                    <option value="Sítio Baichio" data-taxa="4.00">📍 Sítio Baichio - R$ 4,00</option>
                    <option value="Retirada no Local" data-taxa="0"> Retirar no local - Grátis</option>
                </select>
            </div>

            <div class="form-group">
                <label>Itens do Pedido:</label>
                <input type="text" id="pedidoItens" placeholder="Ex: 2x Pizza Calabresa G">
            </div>

            <div class="form-group">
                <label>Subtotal - Valor das Pizzas (R$):</label>
                <input type="number" id="pedidoSubtotal" placeholder="90.00" step="0.01"
                    onchange="calcularTotalAutomatico()">
            </div>

            <div class="form-group">
                <label>Taxa de Entrega (R$):</label>
                <input type="number" id="taxaEntrega" placeholder="0.00" step="0.01" readonly
                    style="background: #f0f0f0; color: #666;">
            </div>

            <div class="form-group">
                <label>Total (R$):</label>
                <input type="number" id="pedidoTotal" placeholder="0.00" step="0.01" readonly
                    style="background: #28a745; color: white; font-weight: bold; font-size: 1.2em;">
            </div>

            <div class="form-group">
                <label>Status:</label>
                <select id="pedidoStatus">
                    <option value="Pendente">Pendente</option>
                    <option value="Em Preparo">Em Preparo</option>
                    <option value="Entregue">Entregue</option>
                </select>
            </div>

            <button class="btn-save" onclick="salvarPedidoReal()"> Salvar Pedido</button>
            <button class="btn-close" onclick="closeModal('modalPedido')">Cancelar</button>
        </div>
    </div>
    <!-- MODAL PEDIDO Fim -->

    <!-- MODAL INSUMO -->
    <div id="modalInsumo" class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloModalInsumo">
        <div class="modal-content modal-insumo">
            <div class="modal-header">
                <h3 id="tituloModalInsumo">🧀 Novo Insumo</h3>
                <button class="btn-fechar" onclick="closeModal('modalInsumo')">×</button>
            </div>

            <form id="formInsumo" onsubmit="salvarInsumoReal(event)">
                <input type="hidden" id="insumoId">

                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="insumoNome">Nome do Insumo *</label>
                        <input type="text" id="insumoNome" required placeholder="Ex: Queijo Mussarela">
                    </div>

                    <div class="form-group">
                        <label for="insumoCategoria">Categoria *</label>
                        <select id="insumoCategoria" required>
                            <option value="Ingrediente">Ingrediente</option>
                            <option value="Embalagem">Embalagem</option>
                            <option value="Bebida">Bebida</option>
                            <option value="Alimento">Alimento</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="insumoUnidade">Unidade *</label>
                        <select id="insumoUnidade" required>
                            <option value="kg">Quilograma (kg)</option>
                            <option value="L">Litro (L)</option>
                            <option value="un">Unidade (un)</option>
                            <option value="pct">Pacote (pct)</option>
                            <option value="cx">Caixa (cx)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="insumoQuantidade">Quantidade Atual *</label>
                        <input type="number" id="insumoQuantidade" step="0.01" required placeholder="10.00">
                    </div>

                    <div class="form-group">
                        <label for="insumoEstoqueMinimo">Estoque Mínimo *</label>
                        <input type="number" id="insumoEstoqueMinimo" step="0.01" required placeholder="5.00">
                    </div>

                    <div class="form-group">
                        <label for="insumoPreco">Preço Unitário (R$) *</label>
                        <input type="number" id="insumoPreco" step="0.01" required placeholder="45.00">
                    </div>

                    <div class="form-group">
                        <label for="insumoValidade">Data de Validade</label>
                        <input type="date" id="insumoValidade">
                    </div>

                    <div class="form-group full-width">
                        <label for="insumoFornecedor">Fornecedor</label>
                        <input type="text" id="insumoFornecedor" placeholder="Ex: Mercado do João">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancelar" onclick="closeModal('modalInsumo')">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-salvar">
                        💾 Salvar Insumo
                    </button>
                </div>
            </form>
        </div>
    </div>
    <!-- MODAL INSUMO Fim -->

    <div id="modalFinanceiro" class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloModalFinanceiro">
        <div class="modal-content">
            <h3 id="tituloModalFinanceiro">💰 Novo Lançamento Financeiro</h3>
            <div class="form-group">
                <label>Tipo:</label>
                <select id="finTipo">
                    <option value="Saida">Saída (Despesa)</option>
                    <option value="Entrada">Entrada (Receita)</option>
                </select>
            </div>
            <div class="form-group"><label>Descrição:</label><input type="text" id="finDescricao"
                    placeholder="Ex: Conta de Luz, Venda Avulsa"></div>
            <div class="form-group"><label>Valor (R$):</label><input type="number" id="finValor" placeholder="150.00"
                    step="0.01"></div>
            <div class="form-group">
                <label>Categoria:</label>
                <select id="finCategoria">
                    <option value="Outros">Outros</option>
                    <option value="Venda">Venda Avulsa</option>
                    <option value="Compra Insumo">Compra de Insumo (Manual)</option>
                </select>
            </div>
            <button class="btn-save" onclick="salvarMovimentacaoFinanceiraReal()">💾 Salvar Lançamento</button>
            <button class="btn-close" onclick="closeModal('modalFinanceiro')">Cancelar</button>
        </div>
    </div>

    <script src="assets/js/admin.js"></script>
</body>

</html>
