<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado - S.O.S Pizza</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/sucesso.css">
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>Pagamento Aprovado!</h1>
        <p>Obrigado pela sua compra. Seu pedido já foi recebido e está sendo preparado.</p>
        
        <p class="pedido">Número do Pedido: <span id="pedido-id">Carregando...</span></p>

        <p>Para agilizar sua entrega, clique abaixo para notificar a pizzaria no WhatsApp com os detalhes do seu pedido:</p>

        <a id="link-whatsapp" href="#" class="btn-whatsapp">
            <i class="fab fa-whatsapp"></i> Notificar S.O.S Pizza
        </a>

        <a href="index.html" class="btn-home">Voltar para o Cardápio</a>
    </div>

    <script>
        const numeroPizzaria = '5587981004878';
        const params = new URLSearchParams(window.location.search);
        const pedidoId = params.get('pedido_id');
        
        if (pedidoId) {
            document.getElementById('pedido-id').innerText = '#' + pedidoId.slice(-4);
        } else {
            document.getElementById('pedido-id').innerText = 'Não identificado';
        }

        async function carregarPedido() {
            if (!pedidoId) return;
            
            try {
                const response = await fetch(`/api/pedidos/publico/${pedidoId}`);
                const pedido = await response.json();
                
                if (response.ok && pedido) {
                    let mensagem = `🍕 *NOVO PEDIDO - S.O.S PIZZA (PAGO ONLINE)*\n\n`;
                    mensagem += ` *Cliente:* ${pedido.cliente?.nome || 'Não informado'}\n`;
                    mensagem += `📱 *Telefone:* ${pedido.cliente?.telefone || 'Não informado'}\n`;
                    mensagem += `📍 *Endereço:* ${pedido.cliente?.endereco || 'Não informado'}, ${pedido.cliente?.bairro || ''}\n`;
                    
                    if (pedido.cliente?.referencia) {
                        mensagem += `🏠 *Referência:* ${pedido.cliente.referencia}\n`;
                    }
                    
                    mensagem += `\n📋 *Itens do Pedido:*\n`;
                    
                    if (pedido.itens && pedido.itens.length > 0) {
                        pedido.itens.forEach(item => {
                            mensagem += `• ${item.quantidade}x ${item.nome} - R$ ${(item.preco || 0).toFixed(2)}\n`;
                        });
                    }
                    
                    mensagem += `\n💰 *Subtotal:* R$ ${(pedido.subtotal || 0).toFixed(2)}`;
                    mensagem += `\n🛵 *Taxa de Entrega:* R$ ${(pedido.taxaEntrega || 0).toFixed(2)}`;
                    mensagem += `\n✅ *TOTAL:* R$ ${(pedido.total || 0).toFixed(2)}`;
                    mensagem += `\n *Forma de Pagamento:* Cartão/PIX (Pago via Mercado Pago)`;
                    mensagem += `\n🆔 *ID do Pedido:* ${pedidoId}`;
                    
                    document.getElementById('link-whatsapp').href = 
                        `https://wa.me/${numeroPizzaria}?text=${encodeURIComponent(mensagem)}`;
                } else {
                    const mensagemFallback = `🍕 *PAGAMENTO APROVADO - S.O.S PIZZA*\n\nOlá! Acabei de fazer um pagamento aprovado via Mercado Pago.\n\n🆔 *ID do Pedido:* ${pedidoId}\n\nPor favor, confirmem o preparo e a entrega!`;
                    document.getElementById('link-whatsapp').href = 
                        `https://wa.me/${numeroPizzaria}?text=${encodeURIComponent(mensagemFallback)}`;
                }
            } catch (error) {
                console.error('Erro ao carregar pedido:', error);
                const mensagemErro = ` *PAGAMENTO APROVADO - S.O.S PIZZA*\n\nOlá! Acabei de fazer um pagamento aprovado via Mercado Pago.\n\n🆔 *ID do Pedido:* ${pedidoId}\n\nPor favor, confirmem o preparo e a entrega!`;
                document.getElementById('link-whatsapp').href = 
                    `https://wa.me/${numeroPizzaria}?text=${encodeURIComponent(mensagemErro)}`;
            }
        }

        carregarPedido();
    </script>
</body>
</html>
